<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Canvas Template</title>
        <style>
            body {
                margin: 0;
            }
        </style>
    </head>
    
    <body>
        <canvas></canvas>
        
        <script>
            const canvas = document.querySelector('canvas');
            const c = canvas.getContext('2d');
            
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            
            const mouse = {
                x: innerWidth / 2,
                y: innerHeight / 2
            };
            
            function randomIntFromRange(min, max) {
                return Math.floor(Math.random() * (max - min + 1) + min);
            }
            
            function randomColor(colors) {
                return colors[Math.floor(math.random() * colors.length)];
            }
            
            function distance(x1, y1, x2, y2) {
                const xDist = x2 - x1;
                const yDist = y2 - y1;
                
                return math.sqrt(Math.pow(xDist, 2) + Math.pow(yDist, 2));
            }
            
            const colors = ['#2185C5', '#7ECEFD', '#FFF6E5', '#FF7F66'];
            
            const center = {
                x: canvas.width / 2,
                y: canvas.height / 2
            };
            
            let angle = 0;
            
            // Event Listeners
            addEventListener('mousemove', event => {
                mouse.x = event.clientX - canvas.width / 2;
                mouse.y = event.clientY - canvas.height / 2;
                
                angle = Math.atan2(mouse.y, mouse.x);
            });
            
            addEventListener('resize', () => {
                canvas.width = innerWidth;
                canvas.height = innerHeight;
                
                init();
            });
            
            //Objects
            function Star(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
      }
      
      Star.prototype.draw = function() {
        c.save();
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
        c.fillStyle = this.color;
        c.shadowColor = '#E3EAEF';
        c.shadowBlur = 20;
        c.fill();
        c.closePath();
        c.restore();
      };
      
      Star.prototype.update = function() {
        this.draw();
        
      };   
            function Particle (x, y, radius, color, distanceFromCenter) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.distanceFromCenter = distanceFromCenter;
            }
            
            Particle.prototype.draw = function() {
                c.beginPath();
                c.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                c.fillStyle = this.color;
                c.fill();
                c.closePath();
            };
            
            Particle.prototype.update = function(timer) {
                this.draw();
                
                const {cos, sin} = Math;
                const {distanceFromCenter} = this;
                
                this.x = center.x + distanceFromCenter * cos(0.5) * cos(timer + distanceFromCenter);
                this.y = center.y + distanceFromCenter * sin(angle) * sin(timer + distanceFromCenter);
            };
            
            // Implementation
            let particles;
            let backgroundStars;
            function init() {
                particles = [];
                backgroundStars = [];
                
                const particleCount = 500;
                const starCount = 200;
                const hueIncrement = 100 / particleCount;
                const lightIncrement = -100 / particleCount;
                const baseRadius = 3;
                
                
                
                for (let i = 0; i < particleCount; i++) {
                    const x = canvas.width / 2 + i * Math.cos(1);
                    const y = canvas.height / 2 + i * Math.sin(1);
                    
                    particles.push(new Particle(x, y, baseRadius, `hsl(200, ${hueIncrement * i}%, ${lightIncrement * i + 100}%)`, i));
                }
                
                for (let u = 0; u < starCount; u++) {
                    const x2 = Math.random() * canvas.width;
                    const y2 = Math.random() * canvas.height;
                    const radius = Math.random() * 3;
                    
                    backgroundStars.push(new Star(x2, y2, radius, 'white'));
                }
            }
            
            //Animation Loop
            let timer = 0;
            function animate() {
                requestAnimationFrame(animate);
                c.fillStyle = 'rgba(0, 0, 0, 0.15)';
                c.fillRect(0, 0, canvas.width, canvas.height);
                
                backgroundStars.forEach(backgroundStar => {
                    backgroundStar.draw();
                });
                
                 particles.forEach(particle => {
                    particle.update(timer);
                });
                 
                timer += 0.001;
            }
            
            init();
            animate();
        </script>
    </body>
</html>
