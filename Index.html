<DOCTYPE html>
    <html> 
        <head>
            <title>Alex Moore</title>
            <meta charset="UTF-8">
            <meta http-equiv="X-UA-Compatible" content="IE=edge">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link href="SiteStyle/global.css" rel="stylesheet" />
        </head>

        <body>
            <script src="Scripts/SiteScript.js"></script>
            <!--Background animation-->
            <canvas id="Galaxy"></canvas>
            <script src="Scripts/Galaxy.js"></script>

            <!--Galaxy features slider-->
            <div class="slider">
                <input type="range" min="100" max="10000" value="3000" class="sliderInput" id="starNumSlider" oninput="updateGalaxyStars(this.value)">
                <p class="sliderText" id="starNumText">Star Count: 3000</p>
                <input type="range" min="0" max="0.1" value="0.0001" step="0.0001" class="sliderInput" id="starSpeedSlider" oninput="updateGalaxySpeed(this.value)">
                <p class="sliderText" id="starSpeedText">Star Speed: 0.0001</p>
                <input type="range" min="0" max="255" value="200" class="sliderInput" id="starColorSlider" oninput="updateGalaxyColor(this.value)">
                <p class="sliderText" id="starColorText">Star Color</p>
            </div>

            <!--Navigation bar-->
            <div class="nav">
                <a href="index.html">Home</a>
                <a href="project.html">Project</a>
                <a href="contact.html">Contact</a>
            </div>

            <!--Main content-->
            <div class="container">
                <div class="title">
                    <h1>Alex Moore</h1>
                    <p>Building software, exploring cybersecurity, and creating practical solutions</p>
                </div>
                <div class="content">
                    <p>Filler content for now</p>
                </div>
            </div>
        </body>
    </html>
